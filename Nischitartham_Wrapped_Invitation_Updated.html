<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nischitartham Invitation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family: Georgia, serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(220,196,255,.55), transparent 40%),
    linear-gradient(135deg,#eee4ff,#fff8ff 50%,#e9ddff);
  display:flex;align-items:center;justify-content:center;
  color:#35155f;
}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:1400px}
.hint{position:absolute;top:7%;text-align:center;font-size:clamp(15px,3vw,22px);letter-spacing:1px;opacity:.8;transition:opacity .5s}
.envelope{
  position:relative;width:min(86vw,520px);height:min(58vw,350px);
  cursor:pointer;transform-style:preserve-3d;
  filter:drop-shadow(0 18px 25px rgba(49,22,85,.25));
}
.back{
  position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(145deg,#eee1ff,#d6c0f3);
  border:2px solid rgba(79,36,122,.18);
}
.back:after{
  content:"";position:absolute;inset:10px;border:1px solid rgba(79,36,122,.22);border-radius:11px;
}
.flap{
  position:absolute;z-index:4;left:0;top:0;width:100%;height:72%;
  background:linear-gradient(145deg,#f6edff,#cbb0ec);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.2,.75,.2,1);
  border-radius:15px 15px 0 0;
}
.seal{
  position:absolute;z-index:6;left:50%;top:42%;transform:translate(-50%,-50%);
  width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 12%,#8d57bd 13% 55%,#63328f 56% 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:31px;
  box-shadow:0 5px 12px rgba(54,24,92,.25);
  transition:opacity .5s, transform .5s;
}
.pocket{
  position:absolute;z-index:5;inset:0;
  background:linear-gradient(145deg,#e8d6fa,#bfa1e4);
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  border-radius:16px;
}
.ribbon1,.ribbon2{position:absolute;z-index:7;background:#b58ad7;opacity:.65}
.ribbon1{width:14px;height:100%;left:50%;transform:translateX(-50%)}
.ribbon2{height:14px;width:100%;top:50%;transform:translateY(-50%)}
.card{
  position:absolute;z-index:2;left:50%;top:50%;
  width:min(82vw,470px);max-height:86vh;
  transform:translate(-50%,-47%) translateY(20px) scale(.92);
  opacity:0;pointer-events:none;
  background:#fff;border-radius:12px;padding:7px;
  box-shadow:0 25px 60px rgba(44,18,75,.35);
  transition:transform 1.15s cubic-bezier(.16,.85,.25,1),opacity .7s;
}
.card img{display:block;width:100%;height:auto;max-height:82vh;object-fit:contain;border-radius:7px}
.opened .flap{transform:rotateX(175deg);z-index:1}
.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.opened .ribbon1,.opened .ribbon2{opacity:0;transition:opacity .4s}
.opened .card{opacity:1;transform:translate(-50%,-54%) scale(1);pointer-events:auto;z-index:10}
.opened .hint{opacity:0}
.replay{
  position:absolute;bottom:5%;left:50%;transform:translateX(-50%);
  border:0;border-radius:999px;padding:11px 20px;background:#54247f;color:white;
  font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transition:.4s;
  box-shadow:0 8px 18px rgba(54,24,92,.25)
}
.opened .replay{opacity:1;pointer-events:auto}
.tap{animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
@media(max-width:500px){
 .envelope{width:88vw;height:59vw}
 .card{width:91vw}
}
</style>
</head>
